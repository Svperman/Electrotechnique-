<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>ÉlectroLab – Câblage</title>
  <meta name="description" content="Simulateur interactif de câblage électrotechnique : habitat, commande industrielle, moteurs.">
  <meta name="theme-color" content="#151b26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button id="btnMenu" class="ibtn" aria-label="Menu">☰</button>
    <div class="brand"><span class="bolt">⚡</span><span class="bname">ÉlectroLab</span></div>
    <div class="seg" id="tools" role="group" aria-label="Outil">
      <button data-tool="wire" class="active" title="Câbler : touchez une borne puis une autre">🔌<span class="hide-s"> Câbler</span></button>
      <button data-tool="measure" title="Multimètre : touchez deux bornes">📟<span class="hide-s"> Mesurer</span></button>
    </div>
    <div class="colors" id="colors" aria-label="Couleur du fil"></div>
    <div class="spacer"></div>
    <button id="btnUndo" class="ibtn" title="Annuler (Ctrl+Z)" aria-label="Annuler">↶</button>
    <button id="btnLib" class="pbtn">📚<span class="hide-s"> Schémas</span></button>
  </header>

  <div id="exbar" class="exbar" hidden>
    <div class="extitle"><span id="exMode" class="tag"></span> <b id="exTitle"></b></div>
    <div class="exactions">
      <button id="btnCheck" class="pbtn ok">✔ Vérifier</button>
      <button id="btnConsigne" class="sbtn">Consigne</button>
    </div>
  </div>

  <div class="main">
    <aside id="palette" class="palette">
      <div class="phead"><b>Composants</b><button class="ibtn close-s" data-close="palette" aria-label="Fermer">✕</button></div>
      <input id="psearch" class="psearch" type="search" placeholder="Rechercher…" aria-label="Rechercher un composant">
      <div id="plist"></div>
    </aside>

    <main id="stage" class="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="Plan de câblage : touchez une borne puis une autre pour tirer un fil">
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#2c3648" stroke-width="1"/></pattern>
          <pattern id="grid5" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#grid)"/><path d="M100 0H0V100" fill="none" stroke="#34405a" stroke-width="1.5"/></pattern>
          <radialGradient id="glowg"><stop offset="0" stop-color="#ffe27a" stop-opacity=".95"/><stop offset=".45" stop-color="#ffd23f" stop-opacity=".45"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
        </defs>
        <g id="vp">
          <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid5)"/>
          <g id="lcomps"></g>
          <g id="lwires"></g>
          <g id="lterms"></g>
          <g id="lover"></g>
        </g>
      </svg>
      <div id="meter" class="meter" hidden>
        <div class="mscreen"><span id="mval" aria-live="polite">— — —</span><small>V ~</small></div>
        <div class="mhint" id="mhint">Touchez la 1ʳᵉ borne (pointe rouge)</div>
        <button id="mclear" class="sbtn">Effacer</button>
      </div>
      <div id="hint" class="hint"></div>
      <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
      <div class="zoombar">
        <button id="zIn" class="ibtn" aria-label="Zoom avant">＋</button>
        <button id="zOut" class="ibtn" aria-label="Zoom arrière">－</button>
        <button id="zFit" class="ibtn" aria-label="Recentrer">⤢</button>
      </div>
      <button id="fabAdd" class="fab">＋ Composant</button>
      <button id="fabInfo" class="fab2" aria-label="Propriétés et journal">ⓘ</button>
    </main>

    <aside id="inspector" class="inspector">
      <div class="phead"><b>Propriétés</b><button class="ibtn close-s" data-close="inspector" aria-label="Fermer">✕</button></div>
      <div id="insp"></div>
      <div class="phead sub"><b>Journal</b><button id="btnClearLog" class="sbtn">Vider</button></div>
      <div id="log" class="log"></div>
    </aside>
  </div>

  <div id="menu" class="menu" hidden>
    <button data-m="new">🗋 Nouveau circuit vierge</button>
    <button data-m="lib">📚 Bibliothèque de schémas</button>
    <button data-m="save">💾 Enregistrer (fichier)</button>
    <button data-m="open">📂 Ouvrir un fichier</button>
    <button data-m="clearwires">✂ Retirer tous les fils</button>
    <button data-m="reset">⟲ Réinitialiser les états</button>
    <button data-m="install" id="mInstall" hidden>📲 Installer l'application</button>
    <button data-m="help">❓ Aide</button>
    <a class="mlink" href="legal.html">⚖ Mentions légales &amp; confidentialité</a>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>

  <dialog id="dlg" class="dlg"><div id="dlgBody"></div></dialog>

  <noscript><p style="padding:20px">ÉlectroLab est un simulateur interactif de câblage électrotechnique : il nécessite JavaScript. <a href="legal.html">Mentions légales et confidentialité</a>.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
